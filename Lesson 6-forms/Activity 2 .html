<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 1 Lesson 6 Activity 1 - Personal Details Form</title>
</head>

<body>
    <h1>Cricket Selection Form</h1>
    <h3>Fill in these basic details to continue</h3>

    <form>
        <fieldset>
            <Legend>
              <b>Fill in your personal detais for Cricket Selection pls</b> 
            </Legend>
            
        <label for="name">Name</label> <br>
        <!-- ADD AN INPUT - SIMPLE TEXT TYPE -->
         <input type="text" id="name" name="name">
        <br><br>

        <label for="email">Email ID</label> <br>
        <!-- ADD AN INPUT - EMAIL TYPE -->
         <input type="email" id="email" name="email">
        <br><br>

        <label for="contact">Contact Number (We won't reveal)</label> <br>
        <!-- ADD AN INPUT - PASSWORD TYPE -->
        <input type="password" id="contact" name="contact">
        
        <br><br>

        Gender <br>
        <!-- ADD A LABELS/INPUTS - RADIO TYPE -->
         <label>
            <input type="Radio" id="male" name="gender">Male
         </label>

        <label>
        <input type="Radio" id="female" name="gender">Female
        </label>
        <br><br>

        Favorite food<br>
        <!-- ADD A LABELS/INPUTS - CHECKBOX TYPE -->
        <label>
        <input type="checkbox" id="Square Cut" name="Food">Pizza
        </label>

        <label>
            <input type="checkbox" id="Burger" name="Food">Burger
        </label>

        <label>
            <input type="checkbox" id="Watermelon" name="Food">Watermelon
        </label>
        <br><br>
    <input type="submit" value="create Account">
    </fieldset>
    </form>
</body>

</html>
