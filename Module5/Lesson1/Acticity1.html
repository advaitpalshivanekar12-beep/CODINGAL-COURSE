<!doctype html>
<html>

<head>
    <title>Module 5 - Lesson 1 - Activity 1 - My Game Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: navy;
        }

        button {
            background: navy;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        div {
            border: 1px solid navy;
            width: 280px;
            margin: 6px auto;
            padding: 8px 12px;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h1>My Game Profile</h1>
    <button onclick="ShowProfile()">
        Show Profile
    </button>

    <div><strong>Name: </strong><span id="name"></span></div>
    <div><strong>Score: </strong><span id="score"></span></div>
    <div><strong>Top Score: </strong><span id="record"></span></div>
    <div><strong>Rank: </strong><span id="rank"></span></div>
    <div><strong>Greeting: </strong><span id="greeting"></span></div>
    <div><strong>Stars: </strong><span id="stars"></span></div>
    <div><strong>Bonus Level: </strong><span id="bonus"></span></div>
    <div><strong>Team Name: </strong><span id="team"></span></div>

    <script>
        function ShowProfile(){
            let name ="Advait Palsivanekar";
            document.getElementById("name").innerHTML=name;

           let Myscore=4000;
           let  HighScore=10000;
           document.getElementById("score").innerHTML=Myscore + " OF " + HighScore;

           let istopscore;
           if(Myscore== HighScore){
            istopscore="✅";

           }
           else{
            istopscore="❌";    

           }
           document.getElementById("record").innerHTML=istopscore;

           let rank;
           if(Myscore>=8000){
            rank="🥇";
           }
           else if(Myscore >=5000){
            rank="🥈";
           }

           else {
            rank="🥉";
           }
          
          
          
          
         document.getElementById('rank').innerHTML=rank;

         let greeting;
         let hour = new Date().getHours();
         if(hour<12){
            greeting="Good Morning";
         }else if (hour<17){
            greeting="Good Afternoon";
         }else{
         greeting= "Good Evening";
         }
         document.getElementById("greeting").innerHTML=greeting;
         // While Loop — Stars

            let stars = "";

            let count = 0;
            //This Will Repeat 10 times
            

            while (count < 10) {

                stars = stars + "⭐";



                count = count + 1;

            }

             document.getElementById("stars").innerHTML = stars;
        


        }     
    </script>
</body>

</html>
