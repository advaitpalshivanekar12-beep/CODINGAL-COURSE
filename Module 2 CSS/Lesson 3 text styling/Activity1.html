<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 2 - Lesson 3 Activity 1 - My Superhero Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        /* Typography — font, size, weight, colour for the whole page */
        body {
            background-color: darkblue;
            color: white;
            font-family: "Black Ops One", sans-serif;
        }


        /* Typography + Text Shadow — big bold title with an orange shadow */
        .hero-name {
            font-size:60px;
            font-weight:bold;
            color:yellow;
            text-shadow:7px 7px 5px orange;
        }


        /* Typography + Text Transform — tagline becomes Title Case */
        .tagline {
            font-style:italic;
            color:lightblue;
            text-transform:capitalize;
        }


        /* Text Transform + Text Decoration — section headings in CAPS with underline */
        .label {
            text-transform:uppercase;
            text-decoration:underline;
            color:red;
        }


        /* Typography — powers stand out in bold green */
        .power {
            color:lightgreen;
            font-weight:700;
        }


        /* Text Decoration — weaknesses are crossed out */
        .weakness {
            color:green;
            text-decoration:line-through;
        }


        /* Transform — the badge is tilted to the side */
        .badge {
            font-size:28px;
            font-weight:bold;
            color:black;
            background-color:gold;
            transform:rotate(60deg);
            /* width:40%; */
            display:inline-block;
        }


        /* Typography — footer text */
        .made-by{
            color:coral;
            font-style:italic;

        }
    </style>
</head>

<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">Maths homework</p>
    <p class="weakness">Broccoli</p>

    <div class="badge">Best Superhero is the Spiderman from No Way home</div>

    <p class="made-by">Created by Advait Palshivanekar.</p>
</body>

</html>
